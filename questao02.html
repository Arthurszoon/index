<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formatação de Texto</title>
</head>
<body>
    <p><strong>Texto em negrito (importante)</strong></p>
    <p><em>Texto em itálico (ênfase)</em></p>
    <p><u>Texto sublinhado</u></p>
    <p><mark>Texto marcado com mark</mark></p>
    <p><small>Texto com small (menor importância)</small></p>
</body>
</html>
