<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imagens HTML</title>
</head>
<body>
    <img src="https://picsum.photos/id/1/200/200" alt="Paisagem com árvore">

    <img src="https://picsum.photos/id/2/300/200" alt="Paisagem ampla" width="300">

    <a href="https://www.google.com">
        <img src="https://picsum.photos/id/3/200/150" alt="Imagem clicável">
    </a>

    <figure>
        <img src="https://picsum.photos/id/4/300/200" alt="Legenda da imagem">
        <figcaption>Imagem com legenda usando figure e figcaption</figcaption>
    </figure>
</body>
</html>
