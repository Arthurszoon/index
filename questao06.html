<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Produtos</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Camiseta</td><td>2</td><td>R$ 50,00</td></tr>
            <tr><td>Calça Jeans</td><td>1</td><td>R$ 120,00</td></tr>
            <tr><td>Tênis</td><td>1</td><td>R$ 200,00</td></tr>
            <tr><td>Boné</td><td>3</td><td>R$ 90,00</td></tr>
            <tr><td>Mochila</td><td>1</td><td>R$ 150,00</td></tr>
        </tbody>
        <tfoot>
            <tr><td colspan="2">Total</td><td>R$ 610,00</td></tr>
        </tfoot>
    </table>
</body>
</html>
